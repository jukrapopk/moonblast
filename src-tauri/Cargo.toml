[package]
name = "tauri-app"
version = "0.1.0"
description = "A lightweight Windows Fullscreen Mode / Big Picture-style launcher centered around Moonlight streaming."
authors = ["Jukrapop K <jukrapopk@gmail.com>"]
license = "MIT"
repository = "https://github.com/jukrapopk/moonblast"
homepage = "https://github.com/jukrapopk/moonblast"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
mdns-sd = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
ureq = "2"
lnk = "0.6"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WiFi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Display"] }
# `windows` (typed bindings) is used by `hdr.rs` for DisplayConfig* APIs
# that windows-sys 0.59 doesn't expose, and by `bluetooth.rs` for the
# WinRT Devices::Bluetooth/Enumeration/Radios APIs (no Win32/CLI surface
# exists for Bluetooth discovery + pairing on Windows). Distinct crate
# from windows-sys so the two coexist without conflict.
windows = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
